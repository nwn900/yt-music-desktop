[package]
name = "yt-music-desktop"
version = "0.1.0"
description = "Native desktop wrapper for YouTube Music (WebView2, SMTC media keys, tray, mini-player)"
authors = ["micha"]
license = "ISC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
souvlaki = "0.8"
open = "5"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

# Workaround: upstream `vswhom-sys 0.1.x` emits a __cplusplus COMDAT that the
# link.exe shipping with VS 2026 Build Tools (MSVC 14.50) refuses with
# LNK1143 ("invalid or corrupt file"). A minimal local patch forces the
# older c++14 language standard and disables the /Zc:__cplusplus macro that
# the new compiler stamps by default.
[patch.crates-io]
vswhom-sys = { path = "../local-patches/vswhom-sys-0.1.3" }
