[package]
name = "yt-music-desktop"
version = "0.1.3"
description = "Native desktop wrapper for YouTube Music (WebView2, SMTC media keys, tray, mini-player)"
authors = ["micha"]
license = "ISC"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-winrt-notification = "0.7.3"
tauri-plugin-notification = "2"
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-single-instance = "2.4"
souvlaki = "0.8"
open = "5"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# VS 2026 / MSVC 14.50+ link.exe rejects the COMDAT that upstream
# vswhom-sys 0.1.x emits. See local-patches/README.md.
[patch.crates-io]
vswhom-sys = { path = "../local-patches/vswhom-sys-0.1.3" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
